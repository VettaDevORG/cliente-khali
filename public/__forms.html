<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Khali: formulario</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Copia estática del formulario de contacto para que Netlify lo registre al desplegar. No enlazar. -->
    <form name="contacto" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contacto" />
      <input type="text" name="bot-field" />
      <input type="text" name="nombre" />
      <input type="text" name="contacto" />
      <input type="text" name="servicio" />
      <textarea name="mensaje"></textarea>
      <input type="text" name="pagina" />
    </form>
  </body>
</html>
